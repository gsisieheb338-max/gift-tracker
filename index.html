<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#090b12" />
  <title>Gift Tracker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root{color-scheme:dark;--bg:#090b12;--panel:#121725;--panel2:#171f30;--line:#263149;--muted:#8f9bb3;--text:#f4f6fb;--gold:#f5c76a;--blue:#5b9cff;--green:#56d6a0}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#182642 0,transparent 45%),var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;padding:env(safe-area-inset-top) 16px calc(22px + env(safe-area-inset-bottom))}
    .app{max-width:760px;margin:0 auto}.top{display:flex;align-items:center;justify-content:space-between;padding:18px 2px 20px}.brand{font-weight:900;letter-spacing:.08em;font-size:20px}.brand span{color:var(--gold)}.sub{color:var(--muted);font-size:12px}.live{border:1px solid #285c4c;background:#10271f;color:#7be0b2;border-radius:99px;padding:6px 10px;font-size:11px}
    .hero{border:1px solid #303b54;background:linear-gradient(130deg,#1b263b,#101522 65%);border-radius:22px;padding:18px;margin-bottom:16px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:20px;top:10px;color:#d6a94f;font-size:80px;opacity:.16}.hero h1{font-size:25px;line-height:1.12;margin:0 0 7px;max-width:270px}.hero p{margin:0;color:#aab6cb;font-size:13px;max-width:300px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0 18px}.stat,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px}.stat{padding:12px 10px}.stat b{font-size:22px;display:block}.stat small{color:var(--muted);font-size:11px}
    .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:5px;background:#0e1320;border:1px solid var(--line);border-radius:14px;margin-bottom:14px}.tab{border:0;background:transparent;color:var(--muted);padding:10px 4px;border-radius:10px;font-weight:700;font-size:13px}.tab.active{background:#26344d;color:white}
    .panel{padding:15px;margin-bottom:13px}.section-title{font-weight:800;margin-bottom:11px}.search{width:100%;border:1px solid var(--line);background:#0b101b;color:white;padding:13px 14px;border-radius:12px;font-size:14px;outline:none}.search:focus{border-color:var(--blue)}.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.field label{display:block;color:var(--muted);font-size:11px;margin:0 0 6px}.field select{width:100%;border:1px solid var(--line);background:#0b101b;color:white;border-radius:11px;padding:11px 8px;font-size:13px}
    .list-head{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 9px}.count{color:var(--muted);font-size:12px}.user{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #202a3d}.user:last-child{border-bottom:0;padding-bottom:0}.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#293d60,#172236);display:grid;place-items:center;font-size:20px}.user-main{flex:1;min-width:0}.username{font-weight:750}.meta{font-size:11px;color:var(--muted)}.pill{font-size:11px;color:#c8d8f5;background:#1c2b43;border:1px solid #2c4265;padding:5px 8px;border-radius:99px;white-space:nowrap}
    .event{display:flex;gap:11px;padding:12px 0;border-bottom:1px solid #202a3d}.event:last-child{border:0}.event-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:12px;background:#202c43;font-size:18px}.event-main{flex:1}.event-title{font-weight:750}.event-desc{font-size:12px;color:var(--muted)}.tag{font-size:10px;border-radius:99px;padding:4px 7px;height:max-content;background:#173b30;color:#77dfb1}.tag.blue{background:#192f4d;color:#8dbaff}
    .empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.foot{text-align:center;color:#66728a;font-size:10px;padding:10px}
    @media(min-width:600px){body{padding-top:28px}.hero{padding:25px}.hero h1{font-size:30px}}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">GIFT <span>TRACKER</span></div><div class="sub">Telegram NFT intelligence</div></div><div class="live">● PRIVATE APP</div></header>
  <section class="hero"><h1>Находи. Отслеживай. Анализируй.</h1><p>Профили Telegram, улучшения подарков и новые объявления маркетплейса — в одном месте.</p></section>
  <section class="stats">
    <div class="stat"><b id="statAccounts">—</b><small>Аккаунты</small></div>
    <div class="stat"><b id="statUpgrades">—</b><small>Upgrade</small></div>
    <div class="stat"><b id="statMarket">—</b><small>На маркете</small></div>
  </section>
  <nav class="tabs">
    <button class="tab active" data-tab="accounts">Аккаунты</button><button class="tab" data-tab="upgrades">Upgrade</button><button class="tab" data-tab="market">Marketplace</button>
  </nav>
  <main id="content"></main>
  <div class="foot">GIFT TRACKER · Данные демонстрационные · Источники подключаются отдельно</div>
</div>
<script>
  const tg = window.Telegram?.WebApp;
  if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#090b12'); tg.setBackgroundColor('#090b12'); } catch(e) {} }
  const demoUsers = [
    {u:'@giftcollector',c:'Китай',n:14,e:'🇨🇳'},
    {u:'@tonwhale',c:'Арабы',n:8,e:'🇦🇪'},
    {u:'@premiumgifts',c:'Девушки',n:3,e:'👤'},
    {u:'@nft_hunter',c:'Другие',n:22,e:'🌍'},
    {u:'@telegramstar',c:'Китай',n:5,e:'🇨🇳'},
    {u:'@giftwatcher',c:'Другие',n:1,e:'🌍'}
  ];
  const events = [
    {i:'💎',t:'Улучшение подарка',d:'@giftcollector · пример события',tag:'UPGRADE'},
    {i:'🛍️',t:'Подарок выставлен на маркет',d:'@tonwhale · пример события',tag:'MARKET'},
    {i:'🎁',t:'Новый подарок в профиле',d:'@premiumgifts · пример события',tag:'NEW'}
  ];
  let active='accounts';
  const content=document.getElementById('content');
  function render(){
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===active));
    if(active==='accounts'){
      content.innerHTML=`<section class="panel"><div class="section-title">Поиск аккаунтов</div><input class="search" id="q" placeholder="Введите @username..." autocomplete="off"><div class="filters"><div class="field"><label>Категория</label><select id="cat"><option value="all">Все категории</option><option>Китай</option><option>Арабы</option><option>Девушки</option><option>Другие</option></select></div><div class="field"><label>Количество подарков</label><select id="num"><option value="all">Любое количество</option><option value="1-3">1–3</option><option value="4-6">4–6</option><option value="7-9">7–9</option><option value="10+">10+</option></select></div></div></section><div class="list-head"><b>Аккаунты</b><span class="count" id="found"></span></div><section class="panel" id="users"></section>`;
      const update=()=>{const q=document.getElementById('q').value.toLowerCase(),c=document.getElementById('cat').value,n=document.getElementById('num').value;const arr=demoUsers.filter(x=>x.u.toLowerCase().includes(q)&&(c==='all'||x.c===c)&&(n==='all'||(n==='10+'?x.n>=10:n==='1-3'?x.n<=3:n==='4-6'?x.n>=4&&x.n<=6:x.n>=7&&x.n<=9)));document.getElementById('found').textContent=arr.length+' найдено';document.getElementById('users').innerHTML=arr.length?arr.map(x=>`<div class="user"><div class="avatar">${x.e}</div><div class="user-main"><div class="username">${x.u}</div><div class="meta">${x.c} · ${x.n} подарков</div></div><span class="pill">${x.n} gifts</span></div>`).join(''):'<div class="empty">По заданным фильтрам ничего не найдено</div>';};
      document.getElementById('q').addEventListener('input',update);document.getElementById('cat').addEventListener('change',update);document.getElementById('num').addEventListener('change',update);update();
    } else if(active==='upgrades'||active==='market'){
      const list=active==='upgrades'?events.filter(x=>x.tag==='UPGRADE'||x.tag==='NEW'):events.filter(x=>x.tag==='MARKET');
      content.innerHTML=`<section class="panel"><div class="section-title">${active==='upgrades'?'Последние улучшения и новые подарки':'Новые объявления Marketplace'}</div>${list.map(x=>`<div class="event"><div class="event-icon">${x.i}</div><div class="event-main"><div class="event-title">${x.t}</div><div class="event-desc">${x.d}</div></div><span class="tag ${x.tag==='MARKET'?'blue':''}">${x.tag}</span></div>`).join('')||'<div class="empty">Пока нет событий</div>'}</section><p class="meta">Это демонстрационные события. Реальные события появятся после подключения поддерживаемого источника данных.</p>`;
    }
  }
  document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{active=b.dataset.tab;render()}));
  document.getElementById('statAccounts').textContent='—';document.getElementById('statUpgrades').textContent='—';document.getElementById('statMarket').textContent='—';
  render();
</script>
</body>
</html>
